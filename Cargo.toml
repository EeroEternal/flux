[package]
name = "xlb"
version = "0.0.2"
edition = "2021"
description = "xLB: a streaming-first AI load balancer"
license = "MIT"

[lib]
name = "xlb"
path = "src/lib.rs"

[[bin]]
name = "xlb"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
prometheus = "0.13"
socket2 = { version = "0.5", features = ["all"] }
httparse = "1"
anyhow = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
