name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Re-publish an existing release (binaries, images, release page) without
  # moving the tag: dispatch this workflow with the tag to publish.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.0.9"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # The tag being published: the pushed tag, or the one passed to a manual
  # dispatch.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust

      - name: Build release binary
        env:
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/xlb" dist/
          cp config.toml LICENSE README.md dist/
          tar -C dist -czf "xlb-${{ matrix.target }}.tar.gz" xlb config.toml LICENSE README.md
          shasum -a 256 "xlb-${{ matrix.target }}.tar.gz" > "xlb-${{ matrix.target }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xlb-${{ matrix.target }}
          path: |
            xlb-${{ matrix.target }}.tar.gz
            xlb-${{ matrix.target }}.tar.gz.sha256

  docker:
    name: Publish Docker Image (GHCR & Docker Hub)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        # The workflow GITHUB_TOKEN cannot create or read the container package
        # ("denied: permission_denied: read_package"), so a PAT with
        # `write:packages` can be provided as the GHCR_TOKEN secret. It falls
        # back to the GITHUB_TOKEN for repositories where the package is linked.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME || 'eeroeternal' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          VERSION="${RELEASE_TAG#v}"
          DOCKERHUB_USER="${DOCKERHUB_USERNAME:-eeroeternal}"
          GHCR_OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_user=${DOCKERHUB_USER}" >> "$GITHUB_OUTPUT"
          echo "ghcr_owner=${GHCR_OWNER}" >> "$GITHUB_OUTPUT"

      # The two registries are pushed separately: a permission problem on one
      # registry (GHCR) must not abort the push to the other one (Docker Hub).
      - name: Build and push Docker Hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/${{ steps.meta.outputs.dockerhub_user }}/xlb:${{ steps.meta.outputs.version }}
            docker.io/${{ steps.meta.outputs.dockerhub_user }}/xlb:latest
          build-args: |
            CRATES_MIRROR=
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push GHCR image
        # Best effort: the GHCR push has been denied by the GITHUB_TOKEN since
        # v0.0.4. Keep it out of the release's critical path.
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.ghcr_owner }}/xlb:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.ghcr_owner }}/xlb:latest
          build-args: |
            CRATES_MIRROR=
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `gh release create` resolves the repository from the git remotes, so the
      # workspace needs a checkout; without it the step fails with
      # "fatal: not a git repository".
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${RELEASE_TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              artifacts/*.tar.gz \
              artifacts/*.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              artifacts/*.tar.gz \
              artifacts/*.sha256 \
              --title "$TAG" \
              --generate-notes
          fi
