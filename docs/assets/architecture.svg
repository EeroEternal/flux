<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="100%" height="auto" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="980" height="330" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Column Headers -->
  <g font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.06em" text-anchor="middle">
    <text x="72" y="28">CLIENTS</text>
    <text x="335" y="28" fill="#1D4ED8">FRONTEND STREAMING LB</text>
    <text x="640" y="28">AI GATEWAYS</text>
    <text x="884" y="28">UPSTREAM MODEL PROVIDERS</text>
  </g>

  <!-- ==================== 1. CLIENTS ==================== -->
  <g filter="url(#shadow)">
    <rect x="22" y="56" width="100" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="72" y="75" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E293B">Client #1</text>
    <text x="72" y="90" text-anchor="middle" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#64748B">POST /v1/chat</text>

    <rect x="22" y="136" width="100" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="72" y="155" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E293B">Client #2</text>
    <text x="72" y="170" text-anchor="middle" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#64748B">SSE stream</text>

    <rect x="22" y="216" width="100" height="44" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="72" y="235" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1E293B">Client #N</text>
    <text x="72" y="250" text-anchor="middle" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#64748B">gRPC / HTTP/2</text>
  </g>

  <!-- Client -> xLB Arrows -->
  <g fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow-slate)">
    <path d="M 122 78 C 155 78, 160 126, 192 126"/>
    <path d="M 122 158 L 192 158"/>
    <path d="M 122 238 C 155 238, 160 190, 192 190"/>
  </g>
  <rect x="130" y="100" width="54" height="16" rx="3" fill="#F1F5F9"/>
  <text x="157" y="111" text-anchor="middle" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#475569">TLS/TCP</text>

  <!-- ==================== 2. xLB (FOCAL BOX) ==================== -->
  <g filter="url(#shadow)">
    <rect x="196" y="44" width="278" height="228" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  </g>

  <!-- xLB Header -->
  <text x="335" y="69" text-anchor="middle" font-size="16" font-weight="700" fill="#1E3A8A">xLB</text>
  <rect x="235" y="78" width="200" height="20" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="335" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#1D4ED8">Forwards bytes, not tokens</text>

  <!-- xLB Internal Sub-blocks -->
  <g text-anchor="middle">
    <!-- Block A: Framing & Fallback -->
    <rect x="212" y="108" width="246" height="44" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
    <text x="335" y="126" font-size="12" font-weight="600" fill="#1E293B">Thin-L7 &amp; L4 Splice</text>
    <text x="335" y="142" font-size="10.5" fill="#475569">Zero-buffer stream · Auto L4 fallback</text>

    <!-- Block B: Scheduler & Health -->
    <rect x="212" y="160" width="246" height="44" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
    <text x="335" y="178" font-size="12" font-weight="600" fill="#1E293B">Leastconn + Health</text>
    <text x="335" y="194" font-size="10.5" fill="#475569">/health probes · Layered timeouts</text>

    <!-- Block C: Backend Connection Pool -->
    <rect x="212" y="212" width="246" height="46" rx="6" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="335" y="230" font-size="12" font-weight="700" fill="#1D4ED8">Backend Connection Pool</text>
    <text x="335" y="246" font-size="10.5" fill="#475569">Reuse across POSTs · Pre-byte retry</text>
  </g>

  <!-- xLB -> AI Gateways Fan-out Arrows (Pooled connections) -->
  <g fill="none" stroke="#2563EB" stroke-width="1.8" marker-end="url(#arrow-blue)">
    <path d="M 474 138 C 506 138, 512 80, 546 80"/>
    <path d="M 474 158 L 546 158"/>
    <path d="M 474 178 C 506 178, 512 236, 546 236"/>
  </g>
  <rect x="480" y="140" width="60" height="16" rx="3" fill="#DBEAFE"/>
  <text x="510" y="151" text-anchor="middle" font-size="9.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1D4ED8">pooled</text>

  <!-- ==================== 3. AI GATEWAYS (LiteLLM #1, LiteLLM #2, New API) ==================== -->
  <g filter="url(#shadow)">
    <!-- LiteLLM #1 -->
    <rect x="550" y="52" width="180" height="56" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="566" cy="71" r="4" fill="#10B981"/>
    <text x="576" y="75" font-size="13" font-weight="700" fill="#0F172A">LiteLLM #1</text>
    <text x="562" y="94" font-size="10" fill="#64748B">Auth · Quota · Model routing</text>

    <!-- LiteLLM #2 -->
    <rect x="550" y="130" width="180" height="56" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="566" cy="149" r="4" fill="#10B981"/>
    <text x="576" y="153" font-size="13" font-weight="700" fill="#0F172A">LiteLLM #2</text>
    <text x="562" y="172" font-size="10" fill="#64748B">Auth · Quota · Model routing</text>

    <!-- New API -->
    <rect x="550" y="208" width="180" height="56" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="566" cy="227" r="4" fill="#10B981"/>
    <text x="576" y="231" font-size="13" font-weight="700" fill="#0F172A">New API</text>
    <text x="562" y="250" font-size="10" fill="#64748B">Key management · Token billing</text>
  </g>

  <!-- Gateways -> Upstream Providers (Strictly isolated 1-to-1 parallel paths, no cross-interference) -->
  <g fill="none" stroke="#059669" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-emerald)">
    <path d="M 730 80 L 806 80"/>
    <path d="M 730 158 L 806 158"/>
    <path d="M 730 236 L 806 236"/>
  </g>

  <!-- ==================== 4. UPSTREAM MODEL PROVIDERS (ISOLATED PER GATEWAY) ==================== -->
  <g filter="url(#shadow)">
    <rect x="810" y="54" width="148" height="52" rx="7" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="884" y="75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065F46">OpenAI / Anthropic</text>
    <text x="884" y="93" text-anchor="middle" font-size="10" fill="#047857">Cloud Model APIs</text>

    <rect x="810" y="132" width="148" height="52" rx="7" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="884" y="153" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065F46">DeepSeek / Gemini</text>
    <text x="884" y="171" text-anchor="middle" font-size="10" fill="#047857">Cloud Model APIs</text>

    <rect x="810" y="210" width="148" height="52" rx="7" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="884" y="231" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065F46">Custom / vLLM</text>
    <text x="884" y="249" text-anchor="middle" font-size="10" fill="#047857">Upstream Channels</text>
  </g>

  <!-- Bottom Boundary Annotation Bar -->
  <g>
    <line x1="196" y1="294" x2="474" y2="294" stroke="#2563EB" stroke-width="2"/>
    <circle cx="196" cy="294" r="3" fill="#2563EB"/>
    <circle cx="474" cy="294" r="3" fill="#2563EB"/>
    <text x="335" y="312" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">Byte-level boundary (TCP / HTTP/1.1 heads only)</text>

    <line x1="550" y1="294" x2="958" y2="294" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="550" cy="294" r="3" fill="#64748B"/>
    <circle cx="958" cy="294" r="3" fill="#64748B"/>
    <text x="754" y="312" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Payload / Token-level boundary (JSON, SSE, Models, Billing)</text>
  </g>
</svg>
